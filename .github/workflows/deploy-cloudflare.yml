name: Deploy Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify approved PET NIKA v28 UX/UI
        run: cmp --silent uxui-source/pet-nika-uxui-source.html public/index.html

      - name: Build Cloudflare production bundle
        run: npm run build:vinext

      - name: Deploy to connected Cloudflare account
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy temporary Cloudflare Worker
        if: ${{ secrets.CLOUDFLARE_API_TOKEN == '' }}
        run: npx wrangler deploy --temporary
