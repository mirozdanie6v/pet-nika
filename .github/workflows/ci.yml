name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify approved UX/UI sync
        shell: bash
        run: cmp --silent uxui-source/pet-nika-uxui-source.html public/index.html

      - name: Typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck > typecheck.log 2>&1
          code=$?
          cat typecheck.log
          echo "$code" > typecheck.exit
          exit 0

      - name: Lint
        shell: bash
        run: |
          set +e
          npm run lint > lint.log 2>&1
          code=$?
          cat lint.log
          echo "$code" > lint.exit
          exit 0

      - name: Next.js production build
        shell: bash
        run: |
          set +e
          npm run build > next-build.log 2>&1
          code=$?
          cat next-build.log
          echo "$code" > next-build.exit
          exit 0

      - name: vinext compatibility check
        shell: bash
        run: |
          set +e
          npm run check:vinext > vinext-check.log 2>&1
          code=$?
          cat vinext-check.log
          echo "$code" > vinext-check.exit
          exit 0

      - name: vinext production build
        shell: bash
        run: |
          set +e
          npm run build:vinext > vinext-build.log 2>&1
          code=$?
          cat vinext-build.log
          echo "$code" > vinext-build.exit
          exit 0

      - name: Upload CI diagnostics and lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: |
            typecheck.log
            typecheck.exit
            lint.log
            lint.exit
            next-build.log
            next-build.exit
            vinext-check.log
            vinext-check.exit
            vinext-build.log
            vinext-build.exit
            package-lock.json

      - name: Enforce checks
        shell: bash
        run: |
          test "$(cat typecheck.exit)" = "0"
          test "$(cat lint.exit)" = "0"
          test "$(cat next-build.exit)" = "0"
          test "$(cat vinext-check.exit)" = "0"
          test "$(cat vinext-build.exit)" = "0"

      - name: Remove obsolete branches
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          for branch in \
            deploy-approved-v28 \
            deploy-v28-exact \
            deploy-v28-production \
            feature/approved-home-pet-redesign \
            feature/approved-home-pet-redesign-v2 \
            import-v28-source \
            prepare-uxui-source
          do
            git push origin --delete "$branch" || true
          done

      - name: Commit generated lockfile
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          if [ -n "$(git status --porcelain package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: add npm lockfile"
            git push
          fi
