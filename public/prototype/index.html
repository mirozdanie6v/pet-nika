<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbf8f5"><title>PET NIKA</title><style>html,body{margin:0;min-height:100%;background:#fcf9f6;font-family:system-ui,-apple-system,sans-serif}.load{min-height:100dvh;display:grid;place-items:center;color:#103E86;font-weight:700;letter-spacing:.04em}.err{padding:24px;max-width:620px;line-height:1.5}</style></head><body><div class="load">PET NIKA</div><script>(async()=>{try{const urls=Array.from({length:8},(_,i)=>`/prototype/v28-gz/p${String(i).padStart(2,'0')}.txt`);const parts=await Promise.all(urls.map(async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(`${u}: ${r.status}`);return (await r.text()).trim()}));const raw=atob(parts.join('')),gz=Uint8Array.from(raw,c=>c.charCodeAt(0));if(typeof DecompressionStream==='undefined')throw new Error('Browser gzip decompression is unavailable');const stream=new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();if(!html.trimStart().toLowerCase().startsWith('<!doctype html>')||!html.toLowerCase().includes('</html>'))throw new Error('Incomplete approved v28 source');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML=`<div class="load"><div class="err">PET NIKA deployment error<br><small>${String(e)}</small></div></div>`}})();</script></body></html>
