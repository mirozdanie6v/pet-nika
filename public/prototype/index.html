<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbf8f5"><title>PET NIKA</title><style>html,body{margin:0;min-height:100%;background:#fcf9f6;font-family:system-ui,-apple-system,sans-serif}.load{min-height:100dvh;display:grid;place-items:center;color:#103E86;font-weight:700;letter-spacing:.04em}.err{padding:24px;max-width:620px;line-height:1.5}</style></head><body><div class="load">PET NIKA</div><script>(async()=>{try{const urls=Array.from({length:24},(_,i)=>`/prototype/source-b64/part-${String(i).padStart(3,'0')}.b64`);const chunks=await Promise.all(urls.map(async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(`${u}: ${r.status}`);const s=(await r.text()).trim();const raw=atob(s);return Uint8Array.from(raw,c=>c.charCodeAt(0))}));const size=chunks.reduce((n,c)=>n+c.length,0),all=new Uint8Array(size);let off=0;for(const c of chunks){all.set(c,off);off+=c.length}const html=new TextDecoder('utf-8').decode(all);if(!html.startsWith('<!doctype html>')||!html.includes('</html>'))throw new Error('Incomplete approved v28 source');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML=`<div class="load"><div class="err">PET NIKA deployment error<br><small>${String(e)}</small></div></div>`}})();</script></body></html>
